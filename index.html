<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra cita ☕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory: #f8efe1;
    --paper: #fffdf8;
    --wine: #6e2a38;
    --wine-deep: #4f1e29;
    --gold: #b08d4f;
    --gold-soft: rgba(176, 141, 79, 0.35);
    --taupe: #8a7a6e;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Work Sans', sans-serif;
    color: var(--wine-deep);
    background: var(--ivory);
    background-image: radial-gradient(circle at 50% 0%, #fffaf1 0%, var(--ivory) 65%);
    padding: 8vh 5vw;
    -webkit-font-smoothing: antialiased;
  }

  .frame{
    width: 100%;
    max-width: 440px;
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    padding: 10px;
  }

  .card{
    background: var(--paper);
    border: 1px solid var(--gold-soft);
    border-radius: 2px;
    padding: 3rem 2.4rem 2.6rem;
    text-align: center;
  }

  .emblem{
    width: 56px;
    height: 56px;
    margin: 0 auto 1.4rem;
    display: block;
  }

  .eyebrow{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--gold);
    margin: 0 0 1rem;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(1.7rem, 6vw, 2.15rem);
    line-height: 1.25;
    color: var(--wine);
    margin: 0 0 1rem;
  }

  .sub{
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--taupe);
    max-width: 30ch;
    margin: 0 auto 2rem;
  }

  .divider{
    width: 100%;
    height: 14px;
    margin: 0 auto 2rem;
    display: block;
  }

  .details{
    margin: 0 0 2.2rem;
    line-height: 2;
  }

  .details .line{
    font-size: 1.02rem;
  }

  .details .line strong{
    font-weight: 600;
    color: var(--wine);
  }

  .countdown{
    display: flex;
    justify-content: center;
    gap: 1.3rem;
    margin-bottom: 2.2rem;
  }

  .countdown .unit{ text-align: center; }

  .countdown .num{
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    color: var(--wine);
    font-variant-numeric: tabular-nums;
  }

  .countdown .label{
    font-size: 0.65rem;
    color: var(--taupe);
    margin-top: 0.15rem;
  }

  .cta-row{
    display: flex;
    gap: 0.7rem;
  }

  .btn{
    flex: 1;
    text-align: center;
    text-decoration: none;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    padding: 0.8rem 1rem;
    border-radius: 4px;
    transition: opacity 0.15s ease, background 0.15s ease;
  }

  .btn.primary{
    background: var(--wine);
    color: var(--paper);
  }

  .btn.primary:hover{ background: var(--wine-deep); }

  .btn.secondary{
    background: transparent;
    border: 1px solid var(--gold-soft);
    color: var(--wine);
  }

  .btn.secondary:hover{ background: rgba(176, 141, 79, 0.08); }

  .note{
    margin: 1.8rem 0 0;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--taupe);
  }

  :focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>

  <div class="frame">
    <div class="card">

      <svg class="emblem" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 26H42V42C42 47.5228 37.5228 52 32 52H24C18.4772 52 14 47.5228 14 42V26Z" stroke="#B08D4F" stroke-width="1.6"/>
        <path d="M42 29H46C48.7614 29 51 31.2386 51 34C51 36.7614 48.7614 39 46 39H42" stroke="#B08D4F" stroke-width="1.6"/>
        <path d="M22 10C22 13 25 13 25 16C25 19 22 19 22 22" stroke="#B08D4F" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M32 10C32 13 35 13 35 16C35 19 32 19 32 22" stroke="#B08D4F" stroke-width="1.4" stroke-linecap="round"/>
      </svg>

      <p class="eyebrow">Una invitación</p>
      <h1>¿Nos vemos mañana?</h1>
      <p class="sub">Un café, buena conversación, y ganas de verte.</p>

      <svg class="divider" viewBox="0 0 200 14" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="7" x2="88" y2="7" stroke="#B08D4F" stroke-width="1" opacity="0.5"/>
        <rect x="96" y="3" width="8" height="8" transform="rotate(45 100 7)" fill="#B08D4F" opacity="0.8"/>
        <line x1="112" y1="7" x2="200" y2="7" stroke="#B08D4F" stroke-width="1" opacity="0.5"/>
      </svg>

      <div class="details">
        <p class="line"><strong>Lunes 14 de septiembre</strong></p>
        <p class="line">6:00 pm</p>
        <p class="line">Starbucks — Av. Dos de Mayo 880, San Isidro</p>
      </div>

      <div class="countdown" id="countdown">
        <div class="unit"><div class="num" id="cd-d">00</div><div class="label">días</div></div>
        <div class="unit"><div class="num" id="cd-h">00</div><div class="label">horas</div></div>
        <div class="unit"><div class="num" id="cd-m">00</div><div class="label">min</div></div>
        <div class="unit"><div class="num" id="cd-s">00</div><div class="label">seg</div></div>
      </div>

      <div class="cta-row">
        <a class="btn primary" href="https://maps.app.goo.gl/X63uNyjKdsXzwtrm7" target="_blank" rel="noopener">Cómo llegar</a>
        <a class="btn secondary" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Caf%C3%A9&amp;dates=20260914T230000Z/20260915T003000Z&amp;details=Starbucks%20-%20Dos%20de%20Mayo&amp;location=Av.%20Dos%20de%20Mayo%20880%2C%20San%20Isidro%2C%20Lima" target="_blank" rel="noopener">Agregar a mi calendario</a>
      </div>

      <p class="note">Llego puntual. Si algo cambia, avísame — nos vemos ahí.</p>

    </div>
  </div>

<script>
  // ---- Countdown ----
  var target = new Date("2026-09-14T18:00:00-05:00").getTime();

  function tick(){
    var now = Date.now();
    var diff = Math.max(0, target - now);

    var d = Math.floor(diff / (1000 * 60 * 60 * 24));
    var h = Math.floor((diff / (1000 * 60 * 60)) % 24);
    var m = Math.floor((diff / (1000 * 60)) % 60);
    var s = Math.floor((diff / 1000) % 60);

    var pad = function(n){ return String(n).padStart(2, "0"); };

    document.getElementById("cd-d").textContent = pad(d);
    document.getElementById("cd-h").textContent = pad(h);
    document.getElementById("cd-m").textContent = pad(m);
    document.getElementById("cd-s").textContent = pad(s);

    if (diff <= 0){
      document.querySelector(".eyebrow").textContent = "Es hoy";
    }
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
